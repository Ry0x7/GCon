name: Keep Render backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    environment:
      name: gcon
    env:
      RENDER_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL }}
    steps:
      - name: Require Render URL
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::error::VITE_API_URL is missing from the gcon environment."
            exit 1
          fi

      - name: Ping health endpoint
        run: |
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 10 --max-time 120 \
            "${RENDER_URL%/}/api/health"
